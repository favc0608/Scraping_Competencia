[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-competencia"
version = "1.0.0"
description = "Cambios de precio en tiempo real en los sitios simulados de la competencia de Olist (Grupo 1 - DMC)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.28",
    "ipywidgets>=7.6",
]

[tool.setuptools]
packages = ["olist_competencia"]

[tool.setuptools.package-data]
olist_competencia = ["datos/catalogo.json"]
